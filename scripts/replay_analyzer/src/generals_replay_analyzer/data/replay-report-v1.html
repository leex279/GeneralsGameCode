<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay analysis report</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; }
    body { margin: 0 auto; max-width: 72rem; padding: 2rem; }
    h1, h2 { color: #f9fafb; }
    section { border-top: 1px solid #374151; padding: 1rem 0; }
    dl { display: grid; grid-template-columns: minmax(12rem, 1fr) 2fr; gap: .5rem 1rem; }
    dt { color: #9ca3af; } dd { margin: 0; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .55rem; border-bottom: 1px solid #374151; text-align: left; vertical-align: top; }
    th { color: #9ca3af; }
    code { white-space: pre-wrap; overflow-wrap: anywhere; }
    .unavailable { color: #fbbf24; }
  </style>
</head>
<body>
{{REPORT_BODY}}
</body>
</html>
