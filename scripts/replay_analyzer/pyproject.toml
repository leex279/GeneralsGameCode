[project]
name = "generals-replay-analyzer"
version = "0.1.0"
description = "Replay analysis tools for Command & Conquer: Generals Zero Hour."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.25,<5",
    "numpy>=2.2,<2.5",
    "platformdirs>=4.4,<5",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "scipy>=1.15,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
replay-analyzer = "generals_replay_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generals_replay_analyzer"]
exclude = [
    "src/generals_replay_analyzer/data/**",
    "src/generals_replay_analyzer/db/migrations/**",
    "src/generals_replay_analyzer/web/templates/**",
    "src/generals_replay_analyzer/web/static/**",
]

[tool.hatch.build.targets.wheel.force-include]
"contracts/zero_hour_1_04_message_types.json" = "generals_replay_analyzer/data/zero_hour_1_04_message_types.json"
"contracts/telemetry-v1.schema.json" = "generals_replay_analyzer/data/telemetry-v1.schema.json"
"contracts/telemetry-v2.schema.json" = "generals_replay_analyzer/data/telemetry-v2.schema.json"
"contracts/game-data-catalog-v1.schema.json" = "generals_replay_analyzer/data/game-data-catalog-v1.schema.json"
"contracts/map-asset-v1.schema.json" = "generals_replay_analyzer/data/map-asset-v1.schema.json"
"contracts/map-asset-v2.schema.json" = "generals_replay_analyzer/data/map-asset-v2.schema.json"
"contracts/zero-hour-combat-types-v1.json" = "generals_replay_analyzer/data/zero-hour-combat-types-v1.json"
"src/generals_replay_analyzer/db/migrations/env.py" = "generals_replay_analyzer/db/migrations/env.py"
"src/generals_replay_analyzer/db/migrations/script.py.mako" = "generals_replay_analyzer/db/migrations/script.py.mako"
"src/generals_replay_analyzer/db/migrations/versions/0001_replay_analyzer_v2.py" = "generals_replay_analyzer/db/migrations/versions/0001_replay_analyzer_v2.py"
"src/generals_replay_analyzer/db/migrations/versions/0002_player_identity_audit.py" = "generals_replay_analyzer/db/migrations/versions/0002_player_identity_audit.py"
"src/generals_replay_analyzer/db/migrations/versions/0003_feature_partial_quality.py" = "generals_replay_analyzer/db/migrations/versions/0003_feature_partial_quality.py"
"src/generals_replay_analyzer/db/migrations/versions/0004_job_lifecycle.py" = "generals_replay_analyzer/db/migrations/versions/0004_job_lifecycle.py"
"src/generals_replay_analyzer/db/migrations/versions/0005_llm_graph_immutability.py" = "generals_replay_analyzer/db/migrations/versions/0005_llm_graph_immutability.py"
"src/generals_replay_analyzer/data/strategy-report-v1.txt" = "generals_replay_analyzer/data/strategy-report-v1.txt"
"src/generals_replay_analyzer/data/strategy-report-response-v1.schema.json" = "generals_replay_analyzer/data/strategy-report-response-v1.schema.json"
"src/generals_replay_analyzer/data/strategy-taxonomy-v1.json" = "generals_replay_analyzer/data/strategy-taxonomy-v1.json"
"src/generals_replay_analyzer/data/strategy-taxonomy-v1.schema.json" = "generals_replay_analyzer/data/strategy-taxonomy-v1.schema.json"
"src/generals_replay_analyzer/data/replay-report-v1.html" = "generals_replay_analyzer/data/replay-report-v1.html"
"src/generals_replay_analyzer/data/replay-report-v1.schema.json" = "generals_replay_analyzer/data/replay-report-v1.schema.json"
"src/generals_replay_analyzer/web/templates/base.html" = "generals_replay_analyzer/web/templates/base.html"
"src/generals_replay_analyzer/web/templates/dashboard.html" = "generals_replay_analyzer/web/templates/dashboard.html"
"src/generals_replay_analyzer/web/templates/identity/landing.html" = "generals_replay_analyzer/web/templates/identity/landing.html"
"src/generals_replay_analyzer/web/templates/imports/dialog.html" = "generals_replay_analyzer/web/templates/imports/dialog.html"
"src/generals_replay_analyzer/web/templates/replays/_table.html" = "generals_replay_analyzer/web/templates/replays/_table.html"
"src/generals_replay_analyzer/web/templates/replays/index.html" = "generals_replay_analyzer/web/templates/replays/index.html"
"src/generals_replay_analyzer/web/templates/jobs/index.html" = "generals_replay_analyzer/web/templates/jobs/index.html"
"src/generals_replay_analyzer/web/templates/jobs/_rows.html" = "generals_replay_analyzer/web/templates/jobs/_rows.html"
"src/generals_replay_analyzer/web/templates/jobs/detail.html" = "generals_replay_analyzer/web/templates/jobs/detail.html"
"src/generals_replay_analyzer/web/templates/jobs/_log.html" = "generals_replay_analyzer/web/templates/jobs/_log.html"
