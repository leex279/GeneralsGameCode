"src/generals_replay_analyzer/web/templates/components/pagination.html" = "generals_replay_analyzer/web/templates/components/pagination.html"
"src/generals_replay_analyzer/web/templates/components/pipeline.html" = "generals_replay_analyzer/web/templates/components/pipeline.html"
"src/generals_replay_analyzer/web/templates/components/evidence_drawer.html" = "generals_replay_analyzer/web/templates/components/evidence_drawer.html"
"src/generals_replay_analyzer/web/static/css/app.css" = "generals_replay_analyzer/web/static/css/app.css"
"src/generals_replay_analyzer/web/static/js/app.js" = "generals_replay_analyzer/web/static/js/app.js"
"src/generals_replay_analyzer/web/static/vendor/htmx.min.js" = "generals_replay_analyzer/web/static/vendor/htmx.min.js"
"src/generals_replay_analyzer/web/static/vendor/echarts.min.js" = "generals_replay_analyzer/web/static/vendor/echarts.min.js"
"src/generals_replay_analyzer/web/static/vendor/vendor-manifest.json" = "generals_replay_analyzer/web/static/vendor/vendor-manifest.json"
"src/generals_replay_analyzer/web/static/vendor/THIRD_PARTY_LICENSES.md" = "generals_replay_analyzer/web/static/vendor/THIRD_PARTY_LICENSES.md"

[dependency-groups]
dev = [
    "hypothesis>=6.0,<7",
    "httpx2>=0.0.1,<3",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src"]
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "engine: launches the modern Zero Hour executable for authoritative parser parity",
    "ollama: opt-in live loopback Ollama integration",
]
