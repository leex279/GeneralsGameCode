[project]
name = "generals-replay-analyzer"
version = "0.1.0"
description = "Replay analysis tools for Command & Conquer: Generals Zero Hour."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
replay-analyzer = "generals_replay_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
